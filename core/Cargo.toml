[package]
name = "bridge-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "bridge_core"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
iroh = "1.4"
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
