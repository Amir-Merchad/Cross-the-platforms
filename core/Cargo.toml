[package]
name = "bridge-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "bridge_core"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
iroh = "1.4"
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
uniffi = { version = "0.32", features = ["tokio"] }

[dev-dependencies]
tempfile = "3"

# ponytail: netdev 0.46 (via iroh) uses libc::in6_ifreq, which libc ≥0.2.190 gates to macOS only.
# Drop this pin once netdev/iroh ship an iOS fix.
[target.'cfg(target_os = "ios")'.dependencies]
libc = "=0.2.189"
