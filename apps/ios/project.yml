name: Bridge
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0"        # app and extension must match
    CURRENT_PROJECT_VERSION: "1"
packages:
  BridgeKit:
    path: BridgeKit
targets:
  Bridge:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
      - Generated/bridge_core.swift
    dependencies:
      - package: BridgeKit
      - target: BridgeShare
        embed: true
      - framework: BridgeCore.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: Network.framework
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Bridge
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIAppFonts: [Rubik.ttf]
        NSLocalNetworkUsageDescription: Receive and send files from your other devices.
        NSCameraUsageDescription: Scan the pairing code on your PC.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Files
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.item]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.crosstheplatforms.bridge
      CODE_SIGNING_ALLOWED: "NO"
      OTHER_LDFLAGS: -lc++
  BridgeShare:
    type: app-extension
    platform: iOS
    sources:
      - Share/ShareViewController.swift
    dependencies:
      - package: BridgeKit
    info:
      path: Generated/ShareInfo.plist
      properties:
        CFBundleDisplayName: Bridge
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 20
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsMovieWithMaxCount: 20
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.crosstheplatforms.bridge.share
      CODE_SIGNING_ALLOWED: "NO"
