[package]
name = "ctp-app"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Cross the Platforms — Windows hub"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bridge-core = { path = "../../../core" }
ctp-windows = { path = "../../../platform/windows" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
