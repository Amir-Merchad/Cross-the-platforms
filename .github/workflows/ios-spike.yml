name: ios-spike
on:
  workflow_dispatch:
  push:
    paths: ["core/**", "spikes/ios-app/**", ".github/workflows/ios-spike.yml"]

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-ios }
      - name: Build Rust core (device + host for bindgen)
        run: |
          cargo build -p bridge-core --release --target aarch64-apple-ios
          cargo build -p bridge-core --release
      - name: Swift bindings
        run: cargo run -q -p uniffi-bindgen --release -- generate --library target/release/libbridge_core.dylib --language swift --out-dir spikes/ios-app/Generated
      - name: XCFramework
        working-directory: spikes/ios-app
        run: |
          mkdir -p headers
          cp Generated/bridge_coreFFI.h headers/
          cp Generated/bridge_coreFFI.modulemap headers/module.modulemap
          xcodebuild -create-xcframework -library ../../target/aarch64-apple-ios/release/libbridge_core.a -headers headers -output BridgeCore.xcframework
      - name: Xcode project
        working-directory: spikes/ios-app
        run: brew install xcodegen && xcodegen
      - name: Build unsigned app
        working-directory: spikes/ios-app
        run: xcodebuild -project Spike.xcodeproj -scheme Spike -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        working-directory: spikes/ios-app
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Spike.app Payload/
          zip -qr Spike.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: Spike-ipa, path: spikes/ios-app/Spike.ipa, retention-days: 3 }
