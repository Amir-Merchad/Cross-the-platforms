name: core
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/tauri/pnpm-lock.yaml }
      - name: UI tests and build (the app embeds dist/)
        working-directory: apps/tauri
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
      - run: cargo test -p bridge-core -p ctp-windows
      - run: cargo clippy -p bridge-core -p ctp-windows -p ctp-app -- -D warnings
